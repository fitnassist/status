owner: fitnassist
repo: status

# What gets probed, and why each one is here.
#
# Named for the person reading the page, not for the vendor: someone whose
# payment just failed wants to see "Billing", and has no idea we use Stripe.
# The same labels live in apps/api/src/services/health.service.ts, which is
# what actually runs each check.
#
# Every /health/* endpoint makes a real authenticated call to the provider
# from OUR side, rather than reading the provider's own status page. A revoked
# key, the wrong account, or a network path broken only for us are all green
# on status.stripe.com and all take the product down just as completely.
#
# Deliberately not hosted on anything it watches. The checks run on GitHub
# Actions and the page is served by GitHub Pages, so nothing here depends on
# Vercel or Railway — which is the whole reason this is not the /status page
# that used to live in the web app.
sites:
  - name: Website
    url: https://www.fitnassist.co
  - name: API
    url: https://api.fitnassist.co/health
  - name: Database
    url: https://api.fitnassist.co/health/database
  - name: Authentication
    url: https://api.fitnassist.co/health/auth
  - name: Billing
    url: https://api.fitnassist.co/health/stripe
  - name: Email delivery
    url: https://api.fitnassist.co/health/email
  - name: Photos and video
    url: https://api.fitnassist.co/health/media
  - name: SMS and calls
    url: https://api.fitnassist.co/health/sms
  - name: Food scanning
    url: https://api.fitnassist.co/health/ai

status-website:
  # Switch to `cname: status.fitnassist.co` once the DNS record exists.
  # Setting it before that breaks both URLs: GitHub Pages stops serving the
  # github.io address as soon as a custom domain is configured, and the
  # custom one does not resolve yet.
  baseUrl: /status
  name: Fitnassist
  logoUrl: https://raw.githubusercontent.com/fitnassist/status/master/assets/logo.svg
  faviconSvg: https://raw.githubusercontent.com/fitnassist/status/master/assets/logo.svg
  favicon: https://raw.githubusercontent.com/fitnassist/status/master/assets/favicon.png
  introTitle: "Fitnassist system status"
  introMessage: Live status of everything Fitnassist depends on. Each service is checked every five minutes from GitHub, independently of the services themselves, so this page stays up when they do not.
  # `name` already renders as the title beside the logo, so a "Fitnassist"
  # nav item as well put the word on screen twice.
  navbar:
    - title: Status
      href: /
    - title: Back to Fitnassist
      href: https://www.fitnassist.co
    - title: Support
      href: https://www.fitnassist.co/support

  theme: dark
  links:
    - rel: preconnect
      href: https://fonts.gstatic.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap

  # Fitnassist's own palette over Upptime's dark theme, matching
  # apps/web/src/styles/globals.css.
  #
  # The up/degraded/down colours are left as green/amber/red on purpose. They
  # are not branding, they are the one thing on the page that has to be
  # understood instantly and without reading, and teal-for-good would be worse
  # for everybody to make the screenshot nicer. The active nav underline is
  # coral, which is what the web app's own nav uses for the current item.
  css: |
    /* Rebuilt to match the in-app status page it replaces: a narrow centred
       column, a centred title, and one bordered card per service.

       Upptime's own layout is a wide full-bleed list with a large display
       heading and a sparkline bleeding through each row, which next to the
       rest of the site looked like a different product. */
    :root {
      --body-background-color: #14161f;
      --body-text-color: #f2f2f2;
      --card-background-color: #1c1e2c;
      --card-border-color: #2a2d3c;
      --nav-background-color: #1c1e2c;
      --nav-border-bottom-color: #2a2d3c;
      --nav-current-border-bottom-color: #be274a;
      --tag-color: #14161f;
      --submit-button-background-color: #be274a;
      --submit-button-border-color: #a02040;
      --submit-button-color: #ffffff;
      --error-button-background-color: #be274a;
      --error-button-border-color: #a02040;
      --error-button-color: #ffffff;
      /* The response-time sparkline sits BEHIND the row. At full strength it
         fights the text; faint, it reads as texture. */
      --graph-opacity: 0.18;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* A wide wordmark in a box. Left alone it dwarfs the navbar. */
    .logo { max-height: 1.5rem; width: auto; }

    .container { max-width: 44rem; }

    /* The default is a display-sized heading. The page it replaces used 2rem
       centred, with the explanation beneath it in muted grey. */
    h1 {
      font-size: 1.875rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .lead {
      text-align: center;
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #9da0af;
      margin: 0 auto 2.5rem;
      max-width: 34rem;
    }

    h2 { font-size: 1.125rem; letter-spacing: -0.01em; }

    /* One bordered card per service, name left, status right. */
    .live-status article {
      border: 1px solid #2a2d3c;
      border-left-width: 3px;
      border-radius: 12px;
      background-color: #1c1e2c;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
    }
    .live-status article h4 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 0.25rem;
    }
    .live-status article h4 a { color: #f2f2f2; text-decoration: none; }
    .live-status article h4 a:hover { color: #5ed4c0; }
    /* Favicons fetched per site. Ours are all one API, so they are nine
       copies of the same image saying nothing. */
    .live-status article h4 .icon { display: none; }
    .live-status article div { font-size: 0.8125rem; color: #9da0af; }
    .live-status .data { color: #f2f2f2; font-weight: 500; }

    a { color: #5ed4c0; }

# Notifications are deliberately left off here. GitHub's scheduled workflows
# are not guaranteed to run on time and can be delayed under load, so this is
# a good public record and a poor pager. Alerting is a separate external
# monitor pointed at the same endpoints.
