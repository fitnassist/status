owner: fitnassist
repo: status

# What gets probed, and why each one is here.
#
# Named for the person reading the page, not for the vendor: someone whose
# payment just failed wants to see "Billing", and has no idea we use Stripe.
# The same labels live in apps/api/src/services/health.service.ts, which is
# what actually runs each check.
#
# Every /health/* endpoint makes a real authenticated call to the provider
# from OUR side, rather than reading the provider's own status page. A revoked
# key, the wrong account, or a network path broken only for us are all green
# on status.stripe.com and all take the product down just as completely.
#
# Deliberately not hosted on anything it watches. The checks run on GitHub
# Actions and the page is served by GitHub Pages, so nothing here depends on
# Vercel or Railway — which is the whole reason this is not the /status page
# that used to live in the web app.
sites:
  - name: Website
    url: https://www.fitnassist.co
  - name: API
    url: https://api.fitnassist.co/health
  - name: Database
    url: https://api.fitnassist.co/health/database
  - name: Authentication
    url: https://api.fitnassist.co/health/auth
  - name: Billing
    url: https://api.fitnassist.co/health/stripe
  - name: Email delivery
    url: https://api.fitnassist.co/health/email
  - name: Photos and video
    url: https://api.fitnassist.co/health/media
  - name: SMS and calls
    url: https://api.fitnassist.co/health/sms
  - name: Food scanning
    url: https://api.fitnassist.co/health/ai

status-website:
  # Switch to `cname: status.fitnassist.co` once the DNS record exists.
  # Setting it before that breaks both URLs: GitHub Pages stops serving the
  # github.io address as soon as a custom domain is configured, and the
  # custom one does not resolve yet.
  baseUrl: /status
  name: Fitnassist
  logoUrl: https://raw.githubusercontent.com/fitnassist/status/master/assets/logo.svg
  faviconSvg: https://raw.githubusercontent.com/fitnassist/status/master/assets/logo.svg
  favicon: https://raw.githubusercontent.com/fitnassist/status/master/assets/favicon.png
  introTitle: "System Status"
  introMessage: Current operational status of Fitnassist services
  # `name` already renders as the title beside the logo, so a "Fitnassist"
  # nav item as well put the word on screen twice.
  navbar:
    - title: Status
      href: /
    - title: Back to Fitnassist
      href: https://www.fitnassist.co
    - title: Support
      href: https://www.fitnassist.co/support

  theme: dark
  links:
    - rel: preconnect
      href: https://fonts.gstatic.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap

  # Fitnassist's own palette over Upptime's dark theme, matching
  # apps/web/src/styles/globals.css.
  #
  # The up/degraded/down colours are left as green/amber/red on purpose. They
  # are not branding, they are the one thing on the page that has to be
  # understood instantly and without reading, and teal-for-good would be worse
  # for everybody to make the screenshot nicer. The active nav underline is
  # coral, which is what the web app's own nav uses for the current item.
  # Copied from the page this replaces (apps/web/src/pages/status, removed in
  # fitnassist/fitnassist#324) and from MainLayout's header, rather than
  # approximated: same tokens, same type scale, same spacing.
  #
  # Light, because that page was. The header stays navy because the site's
  # header is navy in both themes.
  css: |
    :root {
      --body-background-color: #ffffff;   /* --background */
      --body-text-color: #131520;         /* --foreground, 230 25% 10% */
      --card-background-color: #ffffff;
      --card-border-color: #dcdde5;       /* --border, 230 15% 88% */
      --nav-background-color: #131520;    /* header: hsl(230 25% 10%) */
      --nav-border-bottom-color: #131520;
      --nav-current-border-bottom-color: transparent;
      /* The rows carry a uniform border like the old page, not a coloured
         left edge. State is the pill on the right. */
      --up-border-left-color: #dcdde5;
      --degraded-border-left-color: #f59e0b;
      --down-border-left-color: #ef4444;
      /* The response-time sparkline bled through every row. */
      --graph-opacity: 0;
    }

    body {
      background: #ffffff;
      color: #131520;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* --- Header: MainLayout's, h-16 --------------------------------------
       Upptime's nav is 75px tall with `overflow: auto`, and renders the logo
       at 48px inside a 40px link — so the wordmark overflowed its own
       container and the top of it was being clipped off. That is what looked
       broken. The site uses h-7 (28px) in a 64px bar. */
    /* !important throughout this block, and not out of laziness: the rules
       being overridden are Svelte's scoped ones, e.g.
       `.logo.svelte-a08hsz img.svelte-a08hsz`, which carry three classes and
       beat anything reasonable written here. The generated hash also changes
       between releases, so matching it would break on the next update. */
    nav { background: #131520 !important; border-bottom: none !important; padding: 0 !important; overflow: visible !important; }
    nav > .container { max-width: none !important; padding: 0 1.5rem !important; height: 4rem !important; min-height: 0 !important; }
    nav > .container > div:first-child { display: flex !important; align-items: center !important; height: 4rem !important; }
    nav .logo { padding: 0 !important; height: 4rem !important; display: flex !important; align-items: center !important; }
    nav .logo img {
      height: 1.75rem !important;
      width: auto !important;
      max-height: none !important;
      display: block !important;
      /* Upptime rounds every logo by 0.2rem, which on a rectangular wordmark
         in a drawn box shaves the corners off the box. */
      border-radius: 0 !important;
    }
    /* The logo IS the wordmark; the site title rendered it a second time. */
    nav .logo > div { display: none !important; }
    nav ul { height: 4rem !important; align-items: center !important; margin: 0 !important; }
    nav a {
      color: rgba(255, 255, 255, 0.8) !important;
      text-transform: uppercase !important;
      font-size: 0.75rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.05em !important;
      border-bottom: none !important;
      padding-bottom: 0 !important;
    }
    nav a:hover { color: #ffffff !important; }
    nav li a[aria-current] { color: #ffffff !important; border-bottom: none !important; }

    /* --- Page: max-w-2xl, py-16 ----------------------------------------- */
    main { padding: 4rem 1rem !important; }
    main .container { max-width: 42rem !important; }
    h1 {
      font-size: 1.875rem !important;
      font-weight: 700 !important;
      text-align: center !important;
      color: #131520 !important;
      margin: 0 !important;
    }
    .lead {
      font-size: 1rem !important;
      text-align: center !important;
      color: #626784 !important;
      margin: 0.5rem 0 3rem !important;
      max-width: none !important;
    }

    /* --- Overall banner: rounded-lg border p-6 mb-8 text-center ---------- */
    main > article {
      display: block !important;
      text-align: center !important;
      border: 1px solid rgba(34, 197, 94, 0.2) !important;
      border-radius: 0.5rem !important;
      background: rgba(34, 197, 94, 0.05) !important;
      color: #22c55e !important;
      font-size: 1.125rem !important;
      font-weight: 600 !important;
      padding: 1.5rem !important;
      margin: 0 0 2rem !important;
    }

    h2 { display: none !important; }

    /* --- Rows: rounded-lg border p-4, space-y-3 -------------------------- */
    .live-status article {
      position: relative !important;
      border: 1px solid #dcdde5 !important;
      border-left-width: 1px !important;
      border-radius: 0.5rem !important;
      background: #ffffff !important;
      background-image: none !important;
      padding: 1rem !important;
      margin: 0 0 0.75rem !important;
    }
    .live-status article h4 { font-size: 1rem !important; font-weight: 500 !important; margin: 0 !important; }
    .live-status article h4 a { color: #131520 !important; text-decoration: none !important; }
    /* Every row points at the same API, so the per-site favicon was nine
       copies of one icon saying nothing. */
    .live-status article h4 .icon { display: none; }
    .live-status article > div { font-size: 0.75rem !important; color: #626784 !important; line-height: 1.5 !important; }
    .live-status .data { color: #626784 !important; font-weight: 400 !important; }

    /* The pill, which is how the old page showed state. */
    .live-status article::after {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
    }
    .live-status article.up::after {
      content: 'Operational';
      background: rgba(34, 197, 94, 0.1);
      color: #22c55e;
    }
    .live-status article.degraded::after {
      content: 'Degraded';
      background: rgba(245, 158, 11, 0.1);
      color: #f59e0b;
    }
    .live-status article.down::after {
      content: 'Down';
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }

    a { color: #228171; }   /* --primary-emphasis */

# Notifications are deliberately left off here. GitHub's scheduled workflows
# are not guaranteed to run on time and can be delayed under load, so this is
# a good public record and a poor pager. Alerting is a separate external
# monitor pointed at the same endpoints.
